[package]
name = "astra-os"
version = "0.1.0"
description = "Astra OS — A Windows-inspired desktop OS simulator"
authors = ["Astra OS contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"                   # compact persistence of binary file payloads
argon2 = { version = "0.5", features = ["std"] }
zeroize = "1"

# Phase 4 — host filesystem bridge
dunce = "1"                       # clean canonicalisation on Windows (no \\?\ prefix)
trash = "5"                       # move host resources to the OS Recycle Bin

# Error handling
thiserror = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"                   # Phase 5 — Windows "App Paths" lookup for host apps

# Logging
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
